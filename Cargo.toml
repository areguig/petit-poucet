[package]
name = "petit-poucet"
version = "0.1.0"
edition = "2024"
description = "Curated, shared Markdown memory for coding agents, served over MCP"
repository = "https://github.com/areguig/petit-poucet"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
jiff = { version = "0.2.37", default-features = false, features = ["std", "serde"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "1.3.0"
tempfile = "3.27.0"
toml = "1.1.6"
walkdir = "2.5.0"

[dev-dependencies]
assert_cmd = "2.2.2"
