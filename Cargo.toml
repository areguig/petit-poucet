[package]
name = "petit-poucet"
version = "0.2.1"
edition = "2024"
description = "Curated, shared Markdown memory for coding agents, served over MCP"
repository = "https://github.com/areguig/petit-poucet"
license = "Apache-2.0"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
jiff = { version = "0.2.37", features = ["serde"] }
regex = "1.13.1"
rmcp = { version = "3.4.1", features = ["server", "transport-io", "macros"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "1.3.0"
serde_json = "1.0.151"
slug = "0.1.6"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt"] }
toml = "1.1.6"
walkdir = "2.5.0"

[dev-dependencies]
assert_cmd = "2.2.2"
