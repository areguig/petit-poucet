name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - if: runner.os == 'Windows'
        run: bash tests/windows_update_red.sh
        shell: bash
      - run: cargo test --no-fail-fast
      - run: sh tests/agents/lib.test.sh
        shell: bash
      # Compare startup-overlap and initialized-server failures; this does not fix the updater.
      - if: runner.os == 'Windows'
        shell: bash
        run: |
          for batch in $(seq 20); do
            for scenario in update_installs_the_latest_release_while_a_server_runs_then_sets_up_the_agents update_installs_the_latest_release_while_an_initialized_server_runs; do
              echo "batch $batch/20: $scenario"
              cargo test --test update "$scenario" -- --exact || { status=$?; echo "failed in batch $batch/20: $scenario"; exit $status; }
            done
          done
