name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --no-fail-fast
      - run: sh tests/agents/lib.test.sh
        shell: bash
      # #165 diagnostic, not a fix: each self-replace step's outcome while the whole update suite repeats.
      - if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: bash
        run: bash tests/windows-update-phases/run.sh "$RUNNER_TEMP/update-phases"
