name: Agents

# Installs petit-poucet into each supported agent's real CLI (latest release) and runs a session against a mock model.
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Hermes Agent v2026.9.24: its installer is taken from the same commit, since newer ones expect newer files.
  HERMES_COMMIT: f97608f178d1ffeca59860195ab7da295f7c8e5f

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        agent: [codex, claude, copilot, cursor, antigravity, opencode, omp, hermes]
        # install-windows only where Windows needs another command.
        include:
          - { agent: codex, install: "npm install -g @openai/codex" }
          - { agent: claude, install: "npm install -g @anthropic-ai/claude-code" }
          - { agent: copilot, install: "npm install -g @github/copilot" }
          - { agent: opencode, install: "npm install -g @opencode/cli" }
          # omp runs on Bun; bun's global bin folder isn't on the Path by default.
          - agent: omp
            install: bun install -g @oh-my-pi/pi-coding-agent && echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
            install-windows: bun install -g @oh-my-pi/pi-coding-agent; Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.bun\bin"
          - agent: cursor
            install: curl https://cursor.com/install -fsS | bash && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            install-windows: irm 'https://cursor.com/install?win32=true' | iex
          # On Windows, the v2026.9.24 installer can't switch to a pinned commit (checkout aborts on "local changes"):
          # the current installer runs instead, which takes Hermes's latest stable release.
          - agent: hermes
            install: curl -fsSL --retry 5 "https://raw.githubusercontent.com/NousResearch/hermes-agent/$HERMES_COMMIT/scripts/install.sh" | bash -s -- --commit "$HERMES_COMMIT" --non-interactive --skip-browser --skip-computer-use && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            install-windows: "& ([scriptblock]::Create((irm -MaximumRetryCount 5 -RetryIntervalSec 10 https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.ps1))) -NonInteractive -SkipComputerUse"
          - agent: antigravity
            # Its server sometimes sends the script gzip-compressed (seen 2026-10-04): --compressed decodes it.
            install: curl -fsSL --compressed --retry 3 https://antigravity.google/cli/install.sh | bash && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            install-windows: irm https://antigravity.google/cli/install.ps1 | iex
    name: ${{ matrix.agent }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: npm ci --prefix tests/agents
      - if: matrix.agent == 'omp'
        uses: oven-sh/setup-bun@v2
      - if: runner.os != 'Windows'
        run: ${{ matrix.install }}
      # Windows installers add their folder to the user Path, which later steps only see through GITHUB_PATH.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $before = [Environment]::GetEnvironmentVariable('Path', 'User') -split ';'
          ${{ matrix.install-windows || matrix.install }}
          [Environment]::GetEnvironmentVariable('Path', 'User') -split ';' | Where-Object { $_ -and $before -notcontains $_ } | Add-Content $env:GITHUB_PATH
      - run: sh tests/agents/isolated.sh ${{ matrix.agent }}
